services:
  - type: web
    name: denis-3d-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    pullRequestPreviews:
      autoDeploy: false
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: RENDER_URL
        sync: false
      - key: PORT
        value: 8443