name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile bot.py config.py auth.py catalog_store.py
      - run: python -m pytest tests/ -q

  deploy:
    if: false # тимчасово вимкнено — увімкнути після налаштування VPS і секретів
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/poselyanov3dprint
            git pull
            .venv/bin/pip install -r requirements.txt
            sudo systemctl restart poselyanov3dprint
