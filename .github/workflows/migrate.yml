name: Migrate Catalog to Supabase

on:
  workflow_dispatch:
    inputs:
      truncate_first:
        description: "Clear existing catalog before migration?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mask database URL in logs
        run: echo "::add-mask::${{ secrets.SUPABASE_DB_URL }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run catalog migration
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: SUPABASE_DB_URL secret is not configured in repository settings."
            exit 1
          fi
          ARGS="--database-url $DATABASE_URL"
          if [ "${{ inputs.truncate_first }}" = "true" ]; then
            ARGS="$ARGS --truncate-first"
          fi
          python scripts/migrate_catalog_to_supabase.py $ARGS
